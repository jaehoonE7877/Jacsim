name: iOS Support CI (Lint/Test)

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    runs-on: macos-latest
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
      TUIST_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TUIST_CONFIG_TOKEN: ${{ secrets.TUIST_CONFIG_TOKEN }}
      TUIST_XCODE_CACHE: ${{ vars.TUIST_XCODE_CACHE }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      TUIST_CACHE_PROFILE: ci
    steps:
      - name: Checkout (policy-compliant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Setup mise (policy-compliant)
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          "${HOME}/.local/bin/mise" --version
          "${HOME}/.local/bin/mise" install
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Preflight
        run: bash scripts/ci/preflight.sh ci

      - name: Authenticate with OIDC (fallback)
        if: ${{ env.TUIST_FULL_HANDLE != '' && env.TUIST_CONFIG_TOKEN == '' }}
        run: mise exec -- tuist auth login

      - name: Install dependencies
        run: mise exec -- tuist install

      - name: Setup Tuist Xcode cache (optional)
        if: ${{ env.TUIST_FULL_HANDLE != '' && (env.TUIST_XCODE_CACHE == '1' || env.TUIST_XCODE_CACHE == 'true') }}
        run: mise exec -- tuist setup cache

      - name: Restore GoogleService-Info.plist (optional on CI)
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        run: bash scripts/ci/prepare-google-service-info.sh

      - name: Lint (optional)
        run: |
          if [ -x "scripts/ci/lint.sh" ]; then
            bash scripts/ci/lint.sh
          else
            echo "No lint script configured. Skipping."
          fi

      - name: Generate workspace
        run: mise exec -- tuist generate --no-open

      - name: Test
        run: mise exec -- tuist test Jacsim
