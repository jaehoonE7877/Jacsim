name: iOS Support CI (Lint/Test)

on:
  pull_request:
    branches:
      - main
    paths:
      - "Projects/Domain/**"
      - "Projects/ExternalInterface/**"
      - "Projects/Data/**"
      - "Projects/Jacsim/**"
      - "Projects/Modules/**"
      - "Tuist/**"
      - "Plugins/**"
      - "Tuist.swift"
      - "Workspace.swift"
      - "Package.swift"
      - "Package.resolved"
      - ".mise.toml"
      - ".tool-versions"
      - "xcconfigs/**"
      - "scripts/ci/**"
      - "scripts/tuist/**"
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      schemes_json: ${{ steps.detect.outputs.schemes_json }}
    steps:
      - name: Checkout (policy-compliant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Detect changed test schemes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA_PR: ${{ github.event.pull_request.head.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
          HEAD_SHA_PUSH: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit_fallback_all() {
            bash scripts/ci/detect-test-schemes.sh --force-all changed_files.txt
          }

          ensure_commit() {
            local sha="$1"
            [[ -z "${sha}" ]] && return 1
            if git cat-file -e "${sha}^{commit}" >/dev/null 2>&1; then
              return 0
            fi
            git fetch --no-tags --depth=1 origin "${sha}" >/dev/null 2>&1 || return 1
            git cat-file -e "${sha}^{commit}" >/dev/null 2>&1
          }

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${BASE_SHA_PR}"
              head_sha="${HEAD_SHA_PR}"
              force_all="false"
              ;;
            push)
              base_sha="${BASE_SHA_PUSH}"
              head_sha="${HEAD_SHA_PUSH}"
              force_all="false"
              ;;
            workflow_dispatch)
              base_sha=""
              head_sha="${HEAD_SHA_PUSH}"
              force_all="true"
              ;;
            *)
              base_sha=""
              head_sha="${HEAD_SHA_PUSH}"
              force_all="false"
              ;;
          esac

          : > changed_files.txt

          if [[ "${force_all}" == "true" ]]; then
            echo "workflow_dispatch detected. Running full suite."
            emit_fallback_all
            exit 0
          fi

          if [[ -n "${base_sha}" && "${base_sha}" != "0000000000000000000000000000000000000000" ]]; then
            if ! ensure_commit "${base_sha}"; then
              echo "Failed to fetch base SHA (${base_sha}); fallback to full suite."
              emit_fallback_all
              exit 0
            fi

            if ! ensure_commit "${head_sha}"; then
              echo "Failed to fetch head SHA (${head_sha}); fallback to GITHUB_SHA."
              head_sha="${GITHUB_SHA}"
              if ! ensure_commit "${head_sha}"; then
                echo "Failed to fetch fallback head SHA (${head_sha}); full suite."
                emit_fallback_all
                exit 0
              fi
            fi

            if ! git diff --name-only "${base_sha}" "${head_sha}" > changed_files.txt; then
              echo "Diff failed for ${base_sha}..${head_sha}; fallback to full suite."
              emit_fallback_all
              exit 0
            fi
          else
            if git rev-parse --verify "${head_sha}^" >/dev/null 2>&1; then
              if ! git diff --name-only "${head_sha}^" "${head_sha}" > changed_files.txt; then
                echo "Diff failed for ${head_sha}^..${head_sha}; full suite."
                emit_fallback_all
                exit 0
              fi
            else
              echo "No parent commit detected; fallback to full suite."
              emit_fallback_all
              exit 0
            fi
          fi

          echo "Changed files:"
          if [[ -s changed_files.txt ]]; then
            sed -n '1,200p' changed_files.txt
          else
            echo "(none detected)"
          fi

          bash scripts/ci/detect-test-schemes.sh changed_files.txt

  prepare_tuist_dependencies:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.should_run == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    outputs:
      cache_primary_key: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}
      cache_status: ${{ steps.tuist-deps-cache-report.outputs.cache_status }}
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
      TUIST_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TUIST_CONFIG_TOKEN: ${{ secrets.TUIST_CONFIG_TOKEN }}
      TUIST_COMPATIBLE_XCODE_VERSION: "16.0"
      TUIST_CACHE_PROFILE: ci
    steps:
      - name: Checkout (policy-compliant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Setup mise (policy-compliant)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          "${HOME}/.local/bin/mise" --version
          "${HOME}/.local/bin/mise" install
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Preflight
        run: bash scripts/ci/preflight.sh ci

      - name: Authenticate with OIDC (fallback)
        if: ${{ env.TUIST_FULL_HANDLE != '' && env.TUIST_CONFIG_TOKEN == '' }}
        run: mise exec -- tuist auth login

      - name: Start Tuist dependency restore timer
        id: tuist-deps-cache-timer
        run: echo "started_at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Restore Tuist dependency cache
        id: tuist-deps-cache-restore
        uses: ./.github/actions/cache/restore
        with:
          path: |
            .build
            Tuist/.build
            Tuist/Dependencies
          key: ${{ runner.os }}-tuist-deps-${{ env.TUIST_COMPATIBLE_XCODE_VERSION }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Tuist.swift', '.mise.toml', '.tool-versions') }}
          restore-keys: |
            ${{ runner.os }}-tuist-deps-${{ env.TUIST_COMPATIBLE_XCODE_VERSION }}-

      - name: Record Tuist dependency cache result
        id: tuist-deps-cache-report
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.tuist-deps-cache-restore.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-matched-key }}
          CACHE_RESTORE_STARTED_AT: ${{ steps.tuist-deps-cache-timer.outputs.started_at }}
        run: |
          set -euo pipefail

          restore_finished_at="$(date +%s)"
          restore_duration_seconds="$((restore_finished_at - CACHE_RESTORE_STARTED_AT))"

          if [[ "${CACHE_HIT}" == "true" ]]; then
            cache_status="exact-hit"
            invalidation_reason="none"
          elif [[ -n "${CACHE_MATCHED_KEY}" ]]; then
            cache_status="partial-hit"
            invalidation_reason="primary key changed or an exact cache has not been saved yet"
          else
            cache_status="miss"
            invalidation_reason="no cache found for this prefix; first run, eviction, or save never completed"
          fi

          {
            echo "cache_status=${cache_status}"
            echo "restore_duration_seconds=${restore_duration_seconds}"
            echo "invalidation_reason=${invalidation_reason}"
          } >> "${GITHUB_OUTPUT}"

          echo "Tuist dependency cache status: ${cache_status}"
          echo "Tuist dependency cache restore time: ${restore_duration_seconds}s"
          echo "Primary key: ${CACHE_PRIMARY_KEY:-<none>}"
          echo "Matched key: ${CACHE_MATCHED_KEY:-<none>}"
          echo "Cache invalidates when runner OS, TUIST_COMPATIBLE_XCODE_VERSION, Package.resolved, Package.swift, Tuist.swift, .mise.toml, or .tool-versions changes."

      - name: Decide whether to install dependencies
        id: tuist-install-plan
        env:
          CACHE_HIT: ${{ steps.tuist-deps-cache-restore.outputs.cache-hit }}
          CACHE_STATUS: ${{ steps.tuist-deps-cache-report.outputs.cache_status }}
        run: |
          set -euo pipefail

          missing_paths=()
          [[ -d ".build/checkouts" ]] || missing_paths+=(".build/checkouts")
          [[ -f ".build/workspace-state.json" ]] || missing_paths+=(".build/workspace-state.json")
          [[ -f ".build/Derived/Package.resolved" ]] || missing_paths+=(".build/Derived/Package.resolved")

          if [[ "${#missing_paths[@]}" -eq 0 ]]; then
            required_state="present"
          else
            required_state="missing"
          fi

          if [[ "${CACHE_HIT}" == "true" && "${required_state}" == "present" ]]; then
            should_install="false"
            install_reason="exact cache hit with required dependency artifacts present"
          elif [[ "${CACHE_HIT}" == "true" ]]; then
            should_install="true"
            install_reason="exact cache hit but required dependency artifacts are missing"
          elif [[ "${CACHE_STATUS}" == "partial-hit" ]]; then
            should_install="true"
            install_reason="partial cache hit; install once and save the exact key"
          else
            should_install="true"
            install_reason="cache miss; install once and publish dependency cache"
          fi

          {
            echo "should_install=${should_install}"
            echo "required_state=${required_state}"
            echo "install_reason=${install_reason}"
          } >> "${GITHUB_OUTPUT}"

          echo "Dependency preparation decision: ${install_reason}"
          if [[ "${required_state}" != "present" ]]; then
            printf 'Missing dependency artifacts: %s\n' "${missing_paths[*]}"
          fi

      - name: Install dependencies
        id: tuist-install
        if: ${{ steps.tuist-install-plan.outputs.should_install == 'true' }}
        run: |
          set -euo pipefail

          install_started_at="$(date +%s)"
          install_status="success"

          if mise exec -- tuist install; then
            install_status="success"
          else
            install_status="failure"
            install_exit_code=$?
          fi

          install_finished_at="$(date +%s)"
          install_duration_seconds="$((install_finished_at - install_started_at))"

          {
            echo "status=${install_status}"
            echo "duration_seconds=${install_duration_seconds}"
          } >> "${GITHUB_OUTPUT}"

          echo "tuist install status: ${install_status}"
          echo "tuist install duration: ${install_duration_seconds}s"

          if [[ "${install_status}" != "success" ]]; then
            exit "${install_exit_code}"
          fi

      - name: Save Tuist dependency cache
        id: tuist-deps-cache-save
        if: ${{ steps.tuist-install-plan.outputs.should_install == 'true' && steps.tuist-deps-cache-restore.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/cache/save
        with:
          path: |
            .build
            Tuist/.build
            Tuist/Dependencies
          key: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}

      - name: Summarize prepared dependencies
        if: ${{ always() }}
        env:
          CACHE_STATUS: ${{ steps.tuist-deps-cache-report.outputs.cache_status }}
          CACHE_PRIMARY_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-matched-key }}
          CACHE_RESTORE_DURATION_SECONDS: ${{ steps.tuist-deps-cache-report.outputs.restore_duration_seconds }}
          CACHE_INVALIDATION_REASON: ${{ steps.tuist-deps-cache-report.outputs.invalidation_reason }}
          CACHE_SAVE_OUTCOME: ${{ steps.tuist-deps-cache-save.outcome }}
          TUIST_INSTALL_STATUS: ${{ steps.tuist-install.outputs.status }}
          TUIST_INSTALL_DURATION_SECONDS: ${{ steps.tuist-install.outputs.duration_seconds }}
          INSTALL_REASON: ${{ steps.tuist-install-plan.outputs.install_reason }}
          SHOULD_INSTALL: ${{ steps.tuist-install-plan.outputs.should_install }}
        run: |
          set -euo pipefail

          hash_file() {
            local file="$1"
            if [[ -f "${file}" ]]; then
              shasum -a 256 "${file}" | awk '{print $1}'
            else
              echo "missing"
            fi
          }

          {
            echo "### Prepared Tuist dependencies"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Cache status | ${CACHE_STATUS:-unknown} |"
            echo "| Restore time | ${CACHE_RESTORE_DURATION_SECONDS:-n/a}s |"
            echo "| Install decision | ${SHOULD_INSTALL:-unknown} |"
            echo "| Install reason | ${INSTALL_REASON:-unknown} |"
            echo "| tuist install status | ${TUIST_INSTALL_STATUS:-skipped} |"
            echo "| tuist install duration | ${TUIST_INSTALL_DURATION_SECONDS:-n/a}s |"
            echo "| Saved refreshed cache | ${CACHE_SAVE_OUTCOME:-skipped} |"
            echo "| Primary key | ${CACHE_PRIMARY_KEY:-none} |"
            echo "| Matched key | ${CACHE_MATCHED_KEY:-none} |"
            echo ""
            echo "Current cache input hashes:"
            echo ""
            echo "| Input | SHA-256 |"
            echo "| --- | --- |"
            echo "| Package.resolved | $(hash_file Package.resolved) |"
            echo "| Package.swift | $(hash_file Package.swift) |"
            echo "| Tuist.swift | $(hash_file Tuist.swift) |"
            echo "| .mise.toml | $(hash_file .mise.toml) |"
            echo "| .tool-versions | $(hash_file .tool-versions) |"
            echo ""
            echo "Invalidation note: ${CACHE_INVALIDATION_REASON:-unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"

  module-unit-tests:
    needs:
      - detect-changes
      - prepare_tuist_dependencies
    if: ${{ needs.detect-changes.outputs.should_run == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        scheme: ${{ fromJson(needs.detect-changes.outputs.schemes_json) }}
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
      TUIST_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TUIST_CONFIG_TOKEN: ${{ secrets.TUIST_CONFIG_TOKEN }}
      TUIST_COMPATIBLE_XCODE_VERSION: "16.0"
      TUIST_CACHE_PROFILE: ci
    steps:
      - name: Checkout (policy-compliant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Setup mise (policy-compliant)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          "${HOME}/.local/bin/mise" --version
          "${HOME}/.local/bin/mise" install
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Preflight
        run: bash scripts/ci/preflight.sh ci

      - name: Authenticate with OIDC (fallback)
        if: ${{ env.TUIST_FULL_HANDLE != '' && env.TUIST_CONFIG_TOKEN == '' }}
        run: mise exec -- tuist auth login

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: bash scripts/ci/prepare-google-service-info.sh

      - name: Start Tuist dependency restore timer
        id: tuist-deps-cache-timer
        run: echo "started_at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - name: Restore prepared Tuist dependency cache
        id: tuist-deps-cache-restore
        uses: ./.github/actions/cache/restore
        with:
          path: |
            .build
            Tuist/.build
            Tuist/Dependencies
          key: ${{ needs.prepare_tuist_dependencies.outputs.cache_primary_key }}
          restore-keys: |
            ${{ runner.os }}-tuist-deps-${{ env.TUIST_COMPATIBLE_XCODE_VERSION }}-

      - name: Record Tuist dependency cache result
        id: tuist-deps-cache-report
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.tuist-deps-cache-restore.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-matched-key }}
          CACHE_RESTORE_STARTED_AT: ${{ steps.tuist-deps-cache-timer.outputs.started_at }}
        run: |
          set -euo pipefail

          restore_finished_at="$(date +%s)"
          restore_duration_seconds="$((restore_finished_at - CACHE_RESTORE_STARTED_AT))"

          if [[ "${CACHE_HIT}" == "true" ]]; then
            cache_status="exact-hit"
            invalidation_reason="none"
          elif [[ -n "${CACHE_MATCHED_KEY}" ]]; then
            cache_status="partial-hit"
            invalidation_reason="primary key changed or an exact cache has not been saved yet"
          else
            cache_status="miss"
            invalidation_reason="no cache found for this prefix; first run, eviction, or save never completed"
          fi

          {
            echo "cache_status=${cache_status}"
            echo "restore_duration_seconds=${restore_duration_seconds}"
            echo "invalidation_reason=${invalidation_reason}"
          } >> "${GITHUB_OUTPUT}"

          echo "Tuist dependency cache status: ${cache_status}"
          echo "Tuist dependency cache restore time: ${restore_duration_seconds}s"
          echo "Primary key: ${CACHE_PRIMARY_KEY:-<none>}"
          echo "Matched key: ${CACHE_MATCHED_KEY:-<none>}"
          echo "Cache invalidates when runner OS, TUIST_COMPATIBLE_XCODE_VERSION, Package.resolved, Package.swift, Tuist.swift, .mise.toml, or .tool-versions changes."

      - name: Decide whether to install dependencies
        id: tuist-install-plan
        env:
          CACHE_HIT: ${{ steps.tuist-deps-cache-restore.outputs.cache-hit }}
          CACHE_STATUS: ${{ steps.tuist-deps-cache-report.outputs.cache_status }}
        run: |
          set -euo pipefail

          missing_paths=()
          [[ -d ".build/checkouts" ]] || missing_paths+=(".build/checkouts")
          [[ -f ".build/workspace-state.json" ]] || missing_paths+=(".build/workspace-state.json")
          [[ -f ".build/Derived/Package.resolved" ]] || missing_paths+=(".build/Derived/Package.resolved")

          if [[ "${#missing_paths[@]}" -eq 0 ]]; then
            required_state="present"
          else
            required_state="missing"
          fi

          if [[ "${CACHE_HIT}" == "true" && "${required_state}" == "present" ]]; then
            should_install="false"
            install_reason="reused exact dependency cache from prepare job"
          elif [[ "${CACHE_HIT}" == "true" ]]; then
            should_install="true"
            install_reason="exact cache hit but required dependency artifacts are missing"
          elif [[ "${CACHE_STATUS}" == "partial-hit" ]]; then
            should_install="true"
            install_reason="partial cache hit; reconcile dependencies before tests"
          else
            should_install="true"
            install_reason="cache miss after prepare job; fallback install required"
          fi

          {
            echo "should_install=${should_install}"
            echo "required_state=${required_state}"
            echo "install_reason=${install_reason}"
          } >> "${GITHUB_OUTPUT}"

          echo "Dependency reuse decision: ${install_reason}"
          if [[ "${required_state}" != "present" ]]; then
            printf 'Missing dependency artifacts: %s\n' "${missing_paths[*]}"
          fi

      - name: Install dependencies
        id: tuist-install
        if: ${{ steps.tuist-install-plan.outputs.should_install == 'true' }}
        run: |
          set -euo pipefail

          install_started_at="$(date +%s)"
          install_status="success"

          if mise exec -- tuist install; then
            install_status="success"
          else
            install_status="failure"
            install_exit_code=$?
          fi

          install_finished_at="$(date +%s)"
          install_duration_seconds="$((install_finished_at - install_started_at))"

          {
            echo "status=${install_status}"
            echo "duration_seconds=${install_duration_seconds}"
          } >> "${GITHUB_OUTPUT}"

          echo "tuist install status: ${install_status}"
          echo "tuist install duration: ${install_duration_seconds}s"

          if [[ "${install_status}" != "success" ]]; then
            exit "${install_exit_code}"
          fi

      - name: Save Tuist dependency cache
        id: tuist-deps-cache-save
        if: ${{ steps.tuist-install-plan.outputs.should_install == 'true' && steps.tuist-deps-cache-restore.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/cache/save
        with:
          path: |
            .build
            Tuist/.build
            Tuist/Dependencies
          key: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}

      - name: Setup Tuist cache
        if: ${{ env.TUIST_CONFIG_TOKEN != '' || env.TUIST_FULL_HANDLE != '' }}
        run: |
          set -euo pipefail
          mise exec -- tuist setup cache
          echo "TUIST_XCODE_CACHE=1" >> "${GITHUB_ENV}"

      - name: Summarize Tuist dependency cache
        if: ${{ always() }}
        env:
          CACHE_STATUS: ${{ steps.tuist-deps-cache-report.outputs.cache_status }}
          CACHE_PRIMARY_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.tuist-deps-cache-restore.outputs.cache-matched-key }}
          CACHE_RESTORE_DURATION_SECONDS: ${{ steps.tuist-deps-cache-report.outputs.restore_duration_seconds }}
          CACHE_INVALIDATION_REASON: ${{ steps.tuist-deps-cache-report.outputs.invalidation_reason }}
          CACHE_SAVE_OUTCOME: ${{ steps.tuist-deps-cache-save.outcome }}
          TUIST_INSTALL_STATUS: ${{ steps.tuist-install.outputs.status }}
          TUIST_INSTALL_DURATION_SECONDS: ${{ steps.tuist-install.outputs.duration_seconds }}
          PREPARED_CACHE_STATUS: ${{ needs.prepare_tuist_dependencies.outputs.cache_status }}
          INSTALL_REASON: ${{ steps.tuist-install-plan.outputs.install_reason }}
          SHOULD_INSTALL: ${{ steps.tuist-install-plan.outputs.should_install }}
        run: |
          set -euo pipefail

          hash_file() {
            local file="$1"
            if [[ -f "${file}" ]]; then
              shasum -a 256 "${file}" | awk '{print $1}'
            else
              echo "missing"
            fi
          }

          {
            echo "### Tuist dependency cache"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Prepare job cache status | ${PREPARED_CACHE_STATUS:-unknown} |"
            echo "| Cache status | ${CACHE_STATUS:-unknown} |"
            echo "| Restore time | ${CACHE_RESTORE_DURATION_SECONDS:-n/a}s |"
            echo "| Install decision | ${SHOULD_INSTALL:-unknown} |"
            echo "| Install reason | ${INSTALL_REASON:-unknown} |"
            echo "| tuist install status | ${TUIST_INSTALL_STATUS:-skipped} |"
            echo "| tuist install duration | ${TUIST_INSTALL_DURATION_SECONDS:-n/a}s |"
            echo "| Saved refreshed cache | ${CACHE_SAVE_OUTCOME:-skipped} |"
            echo "| Primary key | ${CACHE_PRIMARY_KEY:-none} |"
            echo "| Matched key | ${CACHE_MATCHED_KEY:-none} |"
            echo ""
            echo "Cache invalidation signals:"
            echo "- runner.os"
            echo "- TUIST_COMPATIBLE_XCODE_VERSION"
            echo "- Package.resolved"
            echo "- Package.swift"
            echo "- Tuist.swift"
            echo "- .mise.toml"
            echo "- .tool-versions"
            echo ""
            echo "Current cache input hashes:"
            echo ""
            echo "| Input | SHA-256 |"
            echo "| --- | --- |"
            echo "| Package.resolved | $(hash_file Package.resolved) |"
            echo "| Package.swift | $(hash_file Package.swift) |"
            echo "| Tuist.swift | $(hash_file Tuist.swift) |"
            echo "| .mise.toml | $(hash_file .mise.toml) |"
            echo "| .tool-versions | $(hash_file .tool-versions) |"
            echo ""
            echo "Invalidation note: ${CACHE_INVALIDATION_REASON:-unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Test (${{ matrix.scheme }})
        run: mise exec -- tuist test ${{ matrix.scheme }}

  lint-and-test:
    name: lint-and-test
    needs:
      - detect-changes
      - prepare_tuist_dependencies
      - module-unit-tests
    if: ${{ always() }}
    runs-on: macos-latest
    steps:
      - name: Finalize CI result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          SHOULD_RUN: ${{ needs.detect-changes.outputs.should_run }}
          PREPARE_RESULT: ${{ needs.prepare_tuist_dependencies.result }}
          TEST_RESULT: ${{ needs.module-unit-tests.result }}
        run: |
          set -euo pipefail
          echo "detect-changes.result=${DETECT_RESULT}"
          echo "should_run=${SHOULD_RUN}"
          echo "prepare_tuist_dependencies.result=${PREPARE_RESULT}"
          echo "module-unit-tests.result=${TEST_RESULT}"

          if [[ "${DETECT_RESULT}" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "${SHOULD_RUN}" != "true" ]]; then
            echo "No relevant module changes. Unit tests skipped."
            exit 0
          fi

          if [[ "${PREPARE_RESULT}" != "success" ]]; then
            echo "Dependency preparation failed."
            exit 1
          fi

          if [[ "${TEST_RESULT}" != "success" ]]; then
            echo "One or more module unit test jobs failed."
            exit 1
          fi

          echo "All selected module unit tests passed."
