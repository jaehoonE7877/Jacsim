name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: macos-latest
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
      TUIST_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      TUIST_CACHE_PROFILE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Preflight
        run: bash scripts/ci/preflight.sh ci

      - name: Authenticate with OIDC (fallback)
        if: ${{ env.TUIST_TOKEN == '' }}
        run: tuist auth login

      - name: Install dependencies
        run: tuist install

      - name: Setup Tuist cache and Xcode cache
        run: tuist setup cache

      - name: Restore GoogleService-Info.plist (optional on CI)
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        run: bash scripts/ci/prepare-google-service-info.sh

      - name: Generate workspace
        run: tuist generate --no-open

      - name: Build and test
        run: tuist test Jacsim-CI
