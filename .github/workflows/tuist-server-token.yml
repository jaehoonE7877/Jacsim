name: Tuist Server (TUIST_CONFIG_TOKEN)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-tuist-server:
    runs-on: macos-latest
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
      TUIST_CONFIG_TOKEN: ${{ secrets.TUIST_CONFIG_TOKEN }}
      TUIST_COMPATIBLE_XCODE_VERSION: "16.0"
    steps:
      - name: Checkout (policy-compliant)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Setup mise (policy-compliant)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://mise.run | sh
          "${HOME}/.local/bin/mise" --version
          "${HOME}/.local/bin/mise" install
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Validate required variables
        run: |
          if [ -z "${TUIST_FULL_HANDLE:-}" ]; then
            echo "Missing vars.TUIST_FULL_HANDLE"
            echo "Format: account/project (example: my-account/Jacsim)"
            exit 1
          fi
          if [ -z "${TUIST_CONFIG_TOKEN:-}" ]; then
            echo "Missing secrets.TUIST_CONFIG_TOKEN"
            exit 1
          fi

      - name: Install dependencies
        run: mise exec -- tuist install

      - name: Setup Tuist cache
        run: mise exec -- tuist setup cache

      - name: Generate project
        run: mise exec -- tuist generate --no-open
