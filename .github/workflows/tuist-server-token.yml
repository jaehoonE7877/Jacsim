name: Tuist Server (TUIST_CONFIG_TOKEN)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-tuist-server:
    runs-on: macos-latest
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
      TUIST_CONFIG_TOKEN: ${{ secrets.TUIST_CONFIG_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Validate required variables
        run: |
          if [ -z "${TUIST_FULL_HANDLE:-}" ]; then
            echo "Missing vars.TUIST_FULL_HANDLE"
            echo "Format: account/project (example: my-account/Jacsim)"
            exit 1
          fi
          if [ -z "${TUIST_CONFIG_TOKEN:-}" ]; then
            echo "Missing secrets.TUIST_CONFIG_TOKEN"
            exit 1
          fi

      - name: Install dependencies
        run: tuist install

      - name: Setup Tuist cache
        run: tuist setup cache

      - name: Generate project
        run: tuist generate --no-open
