name: Tuist Server (OIDC)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  setup-tuist-server:
    runs-on: macos-latest
    env:
      TUIST_FULL_HANDLE: ${{ vars.TUIST_FULL_HANDLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Validate required variable
        run: |
          if [ -z "${TUIST_FULL_HANDLE:-}" ]; then
            echo "Missing vars.TUIST_FULL_HANDLE"
            echo "Format: account/project (example: my-account/Jacsim)"
            exit 1
          fi

      - name: Authenticate with OIDC
        run: tuist auth login

      - name: Install dependencies
        run: tuist install

      - name: Setup Tuist cache
        run: tuist setup cache

      - name: Generate project
        run: tuist generate --no-open
